<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepped — Mock Interview</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <div class="brand-mark">IP</div>
      <div class="brand-text">
        <span class="name">Prepped</span>
        <span class="sub">Interview Prep Bot</span>
      </div>
    </div>
  </div>
</header>

<div class="stepper" id="stepper">
  <div class="step done"><div class="step-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg></div><div class="step-label">Resume</div></div>
  <div class="step-line"><i style="width:100%"></i></div>
  <div class="step done"><div class="step-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg></div><div class="step-label">Role</div></div>
  <div class="step-line"><i style="width:100%"></i></div>
  <div class="step done"><div class="step-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg></div><div class="step-label">Target</div></div>
  <div class="step-line"><i style="width:100%"></i></div>
  <div class="step active"><div class="step-dot">4</div><div class="step-label">Interview</div></div>
  <div class="step-line"><i></i></div>
  <div class="step"><div class="step-dot">5</div><div class="step-label">Report</div></div>
</div>

<section class="screen" id="screen-interview">
  <div class="screen-head">
    <span class="eyebrow">Step 4 of 5</span>
    <h1>Mock interview</h1>
    <p>Answer as you would in a real interview. Each round is timed, just like the real thing.</p>
  </div>

  <div class="round-tabs" id="roundTabs"></div>

  <div class="card q-card">
    <div class="q-top">
      <span class="q-progress-text" id="qProgressText"></span>
      <div class="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span id="timerDisplay">0:00</span></div>
    </div>
    <div class="q-progress-bar"><i id="qProgressBar"></i></div>
    <div id="questionBody"></div>

    <div class="btn-row">
      <button class="btn btn-ghost" id="prevQBtn">Previous</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="nextQBtn">Submit & Next</button>
    </div>
  </div>

  <div class="btn-row">
    <a href="target.html" class="btn btn-ghost" id="interviewBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Back to target</a>
    <div class="spacer"></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
