version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: ipb_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ipb_db
      MYSQL_USER: ipb_user
      MYSQL_PASSWORD: ipb_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
